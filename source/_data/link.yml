# 友人帐数据源：source/social/link/index.md 里的 flink 模板会读取本文件
# 想加友链：在下面某个分组的 link_list 里追加一项即可
#
# 字段说明：
#   name      站点名
#   link      站点地址（必须带 https://）
#   avatar    头像地址（建议正方形，100x100 以上）
#   descr     一句话简介
#   siteshot  站点预览截图（可选）。不写就自动用 thum.io 现截，
#             但那个服务偶尔抽风，有条件的建议自己传图或截图后放 /assets/ 里。
#
# 分组字段：
#   class_name  分组标题
#   class_desc  分组说明
#   mini: true  该分组用紧凑小卡（无预览图），适合放工具站/不常更新的链接
#
# 想换成「分类导航」式的分组：直接加新的 - class_name 段即可，页面会自动多一栏。
# 排序即展示顺序。

